services:
  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - load-test-net
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - load-test-net
    restart: unless-stopped

  target-service:
    build: ./target-service
    container_name: target-service
    networks:
      - load-test-net
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - API_TOKEN=${API_TOKEN}
      - ALLOWED_TARGET_HOSTS=${ALLOWED_TARGET_HOSTS}
    depends_on:
      - redis
      - postgres
      - target-service
    networks:
      - load-test-net
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001

  worker:
    build: ./worker
    environment:
      - REDIS_URL=${REDIS_URL}
      - WORKER_METRICS_PORT=8002
    depends_on:
      - redis
      - target-service
    networks:
      - load-test-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: prometheus
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./metrics/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - load-test-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8001
        VITE_API_TOKEN: ${API_TOKEN}
    container_name: frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - load-test-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./metrics/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./metrics/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - load-test-net
    restart: unless-stopped

networks:
  load-test-net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
